      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }

      .format-square .tageslosungen-panel,
      .format-story .tageslosungen-panel {
        width: 100%;
      }

      .template-tageslosungen .sender-mark {
        position: absolute;
        right: 56px;
        bottom: 42px;
        margin: 0;
      }

      .template-tageslosungen .panel {
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
      }

      .template-kirchenjahr::before {
        display: none;
      }

      .template-kirchenjahr .panel {
        width: 100%;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
        text-align: center;
      }

      .template-kirchenjahr .panel-meta {
        display: none;
      }

      .template-kirchenjahr .sender-mark {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 36px;
        margin: 0;
        color: var(--text-primary);
        text-align: center;
        font-size: 26px;
      }

      .template-kirchenjahr .title {
        font-size: 68px;
      }

      .format-story .template-kirchenjahr .title {
        font-size: 82px;
      }

      .template-kirchenjahr .title-note {
        color: var(--text-primary);
        font-size: 38px;
        line-height: 1.2;
        margin: 0;
      }

      .format-story .template-kirchenjahr .title-note {
        font-size: 44px;
      }

      .panel-meta {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .pager {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 70px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid var(--border);
        font-size: 22px;
        font-weight: 700;
      }

      .format-landscape .eyebrow,
      .format-landscape .pager {
        font-size: 18px;
        padding: 7px 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: auto;
        min-height: 0;
        padding: 36px;
        border-radius: 34px;
        background: linear-gradient(180deg, rgba(11, 17, 27, 0.28), rgba(11, 17, 27, 0.58));
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 64px var(--shadow);
      }

      .prayer-panel {
        position: relative;
        overflow: hidden;
      }

      .prayer-symbol {
        width: 74px;
        height: 74px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 3px solid var(--accent);
        box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .prayer-symbol-morning {
        background: radial-gradient(circle, var(--accent) 0 42%, transparent 44%);
      }

      .prayer-symbol-evening {
        background: linear-gradient(135deg, transparent 0 45%, var(--accent) 47% 72%, transparent 74%);
        border-color: var(--accent);
      }

      .template-morgengebet .prayer-panel {
        background: linear-gradient(180deg, rgba(36, 84, 106, 0.32), rgba(11, 27, 40, 0.62));
      }

      .template-abendgebet .prayer-panel {
        background: linear-gradient(180deg, rgba(47, 42, 93, 0.34), rgba(15, 16, 41, 0.66));
      }

      .format-landscape .panel {
        gap: 12px;
        padding: 24px 26px;
        border-radius: 24px;
      }

      .accent-line {
        width: 120px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .format-landscape .accent-line {
        width: 72px;
        height: 6px;
      }

      .title {
        margin: 0;
        font-size: 52px;
        line-height: 1.08;
        font-weight: 800;
      }

      .title-story {
        font-size: 64px;
      }

      .format-landscape .title {
        font-size: 32px;
      }

      .title-note {
        margin: 0;
        color: var(--text-secondary);
        font-size: 22px;
        line-height: 1.3;
      }

      .format-landscape .title-note {
        font-size: 14px;
      }

      .body-text {
        margin: 0;
        font-size: 40px;
        line-height: 1.22;
        white-space: pre-wrap;
      }

      .body-text-story {
        font-size: 50px;
      }

      .format-landscape .body-text {
        font-size: 22px;
      }

      .small-text {
        margin: 0;
        color: var(--text-secondary);
        font-size: 26px;
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .format-story .small-text {
        font-size: 28px;
      }

      .format-landscape .small-text {
        font-size: 15px;
      }

      .citation {
        color: var(--accent);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .format-landscape .citation {
        font-size: 16px;
      }

      .sender-mark {
        margin: 0;
        padding-top: 8px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0.03em;
      }

      .format-story .sender-mark {
        font-size: 19px;
      }

      .format-landscape .sender-mark {
        font-size: 12px;
        padding-top: 4px;
      }

      [data-overflow-id] {
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="canvas format-story template-morgengebet">
      <section class="layout">
        <div class="panel-meta">
          <div class="eyebrow">Morgengebet</div>
          <div class="pager">3/6</div>
        </div>
        <section class="panel prayer-panel">
  <div class="prayer-symbol prayer-symbol-morning" aria-hidden="true"></div>
  <p class="body-text" data-overflow-id="primary-text">Wir bitten dich um Weisheit hier im Land in der Klimakrise und im Umgang mit neuem Rechtsextremismus.</p>
  <p class="sender-mark">christoph-fischer.de</p>
</section>

      </section>
    </main>
  </body>
</html>
