      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }

      .format-square .tageslosungen-panel,
      .format-story .tageslosungen-panel {
        width: 100%;
      }

      .template-tageslosungen .sender-mark {
        position: absolute;
        right: 56px;
        bottom: 42px;
        margin: 0;
      }

      .template-tageslosungen .panel {
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
      }

      .template-grundrechte .layout {
        justify-content: flex-start;
      }

      .template-grundrechte .panel {
        position: relative;
        width: 100%;
        height: 100%;
        justify-content: space-between;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
        text-align: center;
      }

      .template-grundrechte .accent-line {
        display: none;
      }

      .template-grundrechte .title {
        margin-top: 0;
      }

      .template-grundrechte .grundrechte-content {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
      }

      .template-grundrechte .sender-mark {
        margin: 0;
        font-size: 18px;
      }

      .format-story .template-grundrechte .sender-mark {
        font-size: 19px;
      }

      .template-kirchenjahr::before {
        display: none;
      }

      .template-kirchenjahr .panel {
        width: 100%;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
        text-align: center;
      }

      .template-kirchenjahr .panel-meta {
        display: none;
      }

      .template-kirchenjahr .sender-mark {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 36px;
        margin: 0;
        color: var(--text-primary);
        text-align: center;
        font-size: 26px;
      }

      .template-kirchenjahr .title {
        font-size: 68px;
      }

      .format-story .template-kirchenjahr .title {
        font-size: 82px;
      }

      .template-kirchenjahr .title-note {
        color: var(--text-primary);
        font-size: 38px;
        line-height: 1.2;

      .format-landscape .title-note {

      .sender-mark {
