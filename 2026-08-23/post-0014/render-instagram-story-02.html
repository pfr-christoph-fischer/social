      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }

      .format-square .tageslosungen-panel,
      .format-story .tageslosungen-panel {
        width: 100%;
      }

      .template-tageslosungen .sender-mark {
        position: absolute;
        right: 56px;
        bottom: 42px;
        margin: 0;
      }

      .template-tageslosungen .panel {
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
      }

      .template-kirchenjahr::before {
        display: none;
      }

      .template-kirchenjahr .panel {
        width: 100%;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
        text-align: center;
      }

      .template-kirchenjahr .panel-meta {
        display: none;
      }

      .template-kirchenjahr .sender-mark {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 36px;
        margin: 0;
        color: var(--text-primary);
        text-align: center;
        font-size: 26px;
      }

      .template-kirchenjahr .title {
        font-size: 68px;
      }

      .format-story .template-kirchenjahr .title {
        font-size: 82px;
      }

      .template-kirchenjahr .title-note {
        color: var(--text-primary);
        font-size: 38px;
        line-height: 1.2;
        margin: 0;
      }

      .format-story .template-kirchenjahr .title-note {
        font-size: 44px;
      }

      .panel-meta {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        border-radius: 999px;

      }

      .prayer-symbol-morning {

      .format-landscape .panel {

      .accent-line {

        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .format-landscape .accent-line {
        width: 72px;
        height: 6px;
      }

      .title {
        margin: 0;
        font-size: 52px;

        font-weight: 800;
      }

      .title-story {
        font-size: 64px;
      }

      .format-landscape .title {
        font-size: 32px;
      }

      .title-note {
        margin: 0;
        color: var(--text-secondary);
        font-size: 22px;
        line-height: 1.3;
      }

      .format-landscape .title-note {
        font-size: 14px;
      }

      .body-text {
        margin: 0;
        font-size: 40px;
        line-height: 1.22;
        white-space: pre-wrap;
      }

      .body-text-story {
        font-size: 50px;
      }

      .format-landscape .body-text {
        font-size: 22px;
      }

      .small-text {
        margin: 0;
        color: var(--text-secondary);
        font-size: 26px;
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .format-story .small-text {

      }

      .format-landscape .small-text {
        font-size: 15px;
      }

      .citation {
        color: var(--accent);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .format-landscape .citation {
        font-size: 16px;
      }

      .sender-mark {
        margin: 0;
        padding-top: 8px;

      .format-landscape .sender-mark {

      }

      [data-overflow-id] {

        overflow: hidden;
