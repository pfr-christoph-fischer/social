      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;

      .layout {

        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;

        padding: 72px 58px;
        gap: 28px;
      }

        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }
