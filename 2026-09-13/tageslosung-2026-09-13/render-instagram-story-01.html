      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }

      .format-square .tageslosungen-panel,
      .format-story .tageslosungen-panel {
        width: 100%;
      }

      .template-tageslosungen .sender-mark {
        position: absolute;
        right: 56px;
        bottom: 42px;
        margin: 0;
      }

      .template-tageslosungen .panel {
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
      }

      .panel-meta {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid var(--border);
        color: var(--text-primary);
