<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --canvas-width: 1080px;
        --canvas-height: 1920px;
        --page-bg: #173248;
        --page-bg-deep: #0a1a27;
        --text-primary: #ffffff;
        --text-secondary: #d9e4ec;
        --accent: #f0c674;
        --surface: rgba(255, 255, 255, 0.1);
        --surface-strong: rgba(10, 14, 22, 0.54);
        --border: rgba(255, 255, 255, 0.22);
        --shadow: rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: var(--canvas-width);
        height: var(--canvas-height);
        overflow: hidden;
      }

      body {
        background: var(--page-bg);
        color: var(--text-primary);
        font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Aptos", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      .canvas {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-image:
      radial-gradient(circle at top left, rgba(240, 198, 116, 0.36) 0%, transparent 28%),
      linear-gradient(165deg, #173248 0%, #0a1a27 100%);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .panel-meta {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-self: flex-start;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .pager {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 70px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid var(--border);
        font-size: 22px;
        font-weight: 700;
      }

      .format-landscape .eyebrow,
      .format-landscape .pager {
        font-size: 18px;
        padding: 7px 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: auto;
        min-height: 0;
        padding: 36px;
        border-radius: 34px;
        background: linear-gradient(180deg, rgba(11, 17, 27, 0.28), rgba(11, 17, 27, 0.58));
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 64px var(--shadow);
      }

      .format-landscape .panel {
        gap: 12px;
        padding: 24px 26px;
        border-radius: 24px;
      }

      .accent-line {
        width: 120px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .format-landscape .accent-line {
        width: 72px;
        height: 6px;
      }

      .title {
        margin: 0;
        font-size: 52px;
        line-height: 1.08;
        font-weight: 800;
      }

      .title-story {
        font-size: 64px;
      }

      .format-landscape .title {
        font-size: 32px;
      }

      .title-note {
        margin: 0;
        color: var(--text-secondary);
        font-size: 22px;
        line-height: 1.3;
      }

      .format-landscape .title-note {
        font-size: 14px;
      }

      .body-text {
        margin: 0;
        font-size: 40px;
        line-height: 1.22;
        white-space: pre-wrap;
      }

      .body-text-story {
        font-size: 50px;
      }

      .format-landscape .body-text {
        font-size: 22px;
      }

      .small-text {
        margin: 0;
        color: var(--text-secondary);
        font-size: 26px;
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .format-story .small-text {
        font-size: 28px;
      }

      .format-landscape .small-text {
        font-size: 15px;
      }

      .citation {
        color: var(--accent);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .format-landscape .citation {
        font-size: 16px;
      }

      .sender-mark {
        margin: 0;
        padding-top: 8px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0.03em;
      }

      .format-story .sender-mark {
        font-size: 19px;
      }

      .format-landscape .sender-mark {
        font-size: 12px;
        padding-top: 4px;
      }

      [data-overflow-id] {
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="canvas format-story">
      <section class="layout">
        <div class="panel-meta">
          <div class="eyebrow">Gebet oder Liedgedanke</div>
          <div class="pager">2/5</div>
        </div>
        <section class="panel">
  <div class="accent-line"></div>
  <p class="body-text body-text-story" data-overflow-id="primary-text">Manchmal suche ich Gott an den besonderen Orten.</p>    <p class="sender-mark">christoph-fischer.de</p>
</section>

      </section>
    </main>
  </body>
</html>
