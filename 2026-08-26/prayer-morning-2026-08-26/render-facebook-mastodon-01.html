<html lang="de">

    <style>
      :root {
        --canvas-width: 1200px;
        --canvas-height: 630px;
        --page-bg: #385b70;
        --page-bg-deep: #172f43;
        --text-primary: #ffffff;
        --text-secondary: #e5f0f2;
        --accent: #f6c453;
        --surface: rgba(255, 255, 255, 0.1);
        --surface-strong: rgba(10, 14, 22, 0.54);
        --border: rgba(255, 255, 255, 0.22);
        --shadow: rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: var(--canvas-width);
        height: var(--canvas-height);
        overflow: hidden;
      }

      body {
        background: var(--page-bg);
        color: var(--text-primary);
        font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Aptos", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .layout {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
        padding: 56px;
      }

      .format-story .layout {
        padding: 72px 58px;
        gap: 28px;
      }

      .format-landscape .layout {
        padding: 42px 48px;
        gap: 18px;
      }

      .format-square .layout,
      .format-story .layout {
        justify-content: center;
      }

      .format-square .panel,
      .format-story .panel {
        margin-top: 0;
      }

      .format-square .tageslosungen-panel,
      .format-story .tageslosungen-panel {
        width: 100%;
      }

      .template-tageslosungen .sender-mark {
        position: absolute;
        right: 56px;
        bottom: 42px;
        margin: 0;
      }

      .template-tageslosungen .panel {
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
      }

      .template-kirchenjahr::before {
        display: none;
      }

      .template-kirchenjahr .panel {
        width: 100%;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
        border-radius: 0;
        text-align: center;
      }

      .template-kirchenjahr .panel-meta {
        display: none;
      }

      .template-kirchenjahr .sender-mark {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 36px;
        margin: 0;
        color: var(--text-primary);
        text-align: center;
        font-size: 26px;
      }

      .template-kirchenjahr .title {
        font-size: 68px;
      }

      .format-story .template-kirchenjahr .title {
        font-size: 82px;
      }

      .template-kirchenjahr .title-note {
        color: var(--text-primary);
        font-size: 38px;
        line-height: 1.2;
